name: Attach release package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach-release-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run checks
        run: npm run check

      - name: Build package
        run: npm pack

      - name: Attach package to v0.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.2.0 cleversql-0.2.0.tgz --clobber

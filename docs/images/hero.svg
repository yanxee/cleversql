<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">CleverSQL — Query freely. Change carefully.</title>
  <desc id="desc">A dark interface illustration showing a read-only query and a governed preview, apply, and revert workflow.</desc>
  <defs>
    <radialGradient id="glow" cx="80%" cy="18%" r="70%">
      <stop offset="0" stop-color="#c8ff62" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#c8ff62" stop-opacity=".03"/>
      <stop offset="1" stop-color="#0a0c0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171c18"/>
      <stop offset="1" stop-color="#0f1210"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#fff" opacity=".05"/>
    </pattern>
    <style>
      .sans { font-family: "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; }
      .muted { fill: #9ba39b; }
      .dim { fill: #6f776f; }
      .text { fill: #f4f7f1; }
      .lime { fill: #c8ff62; }
      .amber { fill: #ffbc66; }
      .red { fill: #ff7770; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0a0c0b"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(58 52)">
    <rect width="44" height="44" rx="12" fill="#151a15" stroke="#ffffff" stroke-opacity=".15"/>
    <rect x="8" y="8" width="11" height="11" rx="2" class="lime"/>
    <rect x="24" y="8" width="11" height="11" rx="2" fill="#f4f7f1" opacity=".9"/>
    <rect x="8" y="24" width="11" height="11" rx="2" fill="#f4f7f1" opacity=".5"/>
    <rect x="24" y="24" width="11" height="11" rx="2" class="lime" opacity=".5"/>
    <text x="60" y="20" class="sans text" font-size="22" font-weight="650">CleverSQL</text>
    <text x="60" y="37" class="mono dim" font-size="9" letter-spacing="2">DATA CONTROL PLANE</text>
  </g>

  <g transform="translate(58 154)">
    <text class="mono lime" font-size="11" letter-spacing="2.2">THE AGENT-SAFE DATA WORKSPACE</text>
    <text class="sans text" font-size="68" font-weight="650" letter-spacing="-4">Query freely.</text>
    <text y="76" class="sans lime" font-size="68" font-weight="650" letter-spacing="-4">Change carefully.</text>
    <text y="120" class="sans muted" font-size="16">Read-only SQL. Previewed writes. Conflict detection. Reversible audit.</text>
  </g>

  <g transform="translate(730 105)">
    <rect width="410" height="458" rx="24" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="28" y="40" class="mono dim" font-size="10" letter-spacing="1.5">GOVERNED CHANGE</text>
    <text x="28" y="68" class="sans text" font-size="22" font-weight="600">Review the exact diff</text>
    <text x="28" y="89" class="mono dim" font-size="9">chg_7f31c9 · expires in 10 minutes</text>

    <rect x="24" y="112" width="362" height="10" rx="5" fill="#222822"/>
    <rect x="24" y="138" width="362" height="10" rx="5" fill="#1a1f1b"/>
    <rect x="24" y="164" width="250" height="10" rx="5" fill="#1a1f1b"/>

    <rect x="24" y="198" width="362" height="94" rx="12" fill="#0c0f0d" stroke="#ffffff" stroke-opacity=".09"/>
    <text x="40" y="222" class="mono dim" font-size="9">1 ROW CHANGED</text>
    <rect x="40" y="240" width="94" height="26" rx="5" fill="#3a1918"/>
    <text x="50" y="257" class="mono red" font-size="10">status: trial</text>
    <text x="150" y="257" class="mono dim" font-size="12">→</text>
    <rect x="173" y="240" width="108" height="26" rx="5" fill="#203314"/>
    <text x="183" y="257" class="mono lime" font-size="10">status: active</text>

    <rect x="24" y="310" width="362" height="68" rx="11" fill="#2a2417" stroke="#ffbc66" stroke-opacity=".25"/>
    <circle cx="44" cy="337" r="7" fill="#ffbc66" opacity=".85"/>
    <text x="61" y="340" class="sans text" font-size="12" font-weight="600">Conflict check armed.</text>
    <text x="61" y="357" class="sans muted" font-size="10">Newer row writes fail closed.</text>

    <g transform="translate(24 402)">
      <rect width="112" height="38" rx="8" fill="#1d211e" stroke="#ffffff" stroke-opacity=".14"/>
      <text x="25" y="24" class="sans text" font-size="11">Back</text>
      <rect x="246" width="116" height="38" rx="8" class="lime"/>
      <text x="275" y="24" class="sans" fill="#10140b" font-size="11" font-weight="650">Apply 1 row</text>
    </g>
  </g>

  <g transform="translate(58 476)">
    <rect width="584" height="90" rx="16" fill="#121612" stroke="#ffffff" stroke-opacity=".09"/>
    <circle cx="28" cy="29" r="7" class="lime" opacity=".9"/>
    <text x="45" y="34" class="sans text" font-size="14" font-weight="600">SQLite + PostgreSQL</text>
    <text x="45" y="55" class="sans muted" font-size="11">One local control plane for humans and agents.</text>
    <text x="410" y="34" class="mono lime" font-size="11">preview</text>
    <text x="467" y="34" class="mono dim" font-size="11">→ apply → revert</text>
  </g>
</svg>
